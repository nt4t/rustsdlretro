[package]
name = "rustsdlretro-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["fbdev"]
fbdev = []
minifb = ["dep:minifb"]
config = ["dep:serde", "dep:serde_json"]
null-audio = []
tokio = ["dep:tokio"]
tungstenite = ["dep:tungstenite"]
png = ["dep:png"]
api = ["tungstenite", "tokio", "async-tungstenite", "futures-util", "dep:png", "dep:serde", "dep:serde_json"]

[dependencies]
libc = "0.2"
evdev = "0.12"
alsa = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
minifb = { package = "minifb", version = "0.28", optional = true, features = ["x11"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
png = { version = "0.17", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
async-tungstenite = { version = "0.35", features = ["tokio-rustls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

[build-dependencies]
bindgen = "0.71"
cc = "1"
