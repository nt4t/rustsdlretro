[target.thumbv7neon-unknown-linux-gnueabihf]
runner = "ssh can@192.168.15.7:"
linker = "arm-linux-gnueabihf-gcc"
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/arm-linux-gnueabihf"]

[target.thumbv7neon-unknown-linux-gnueabihf.env]
env = { PKG_CONFIG_ALLOW_CROSS = "1", PKG_CONFIG_PATH = "/usr/lib/arm-linux-gnueabihf" }
